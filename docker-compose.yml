services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hustlehub-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - USE_HTTPS=false
      - CLIENT_ORIGIN=http://localhost
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hustlehub-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge