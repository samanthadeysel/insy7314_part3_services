$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"john@testing.com\",\r

    \  \"password\": \"Password123!\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Token returned and saved to variable\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"token\");\r

      \    pm.collectionVariables.set(\"clientToken\", jsonData.token);\r

      });"
    language: text/javascript
order: 4829
